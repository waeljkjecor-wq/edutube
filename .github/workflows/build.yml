name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

               - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: Build APK
        shell: bash
        run: |
          set -o pipefail
          gradle assembleRelease --no-daemon --stacktrace 2>&1 | tee build.log

      - name: Report
        if: always()
        shell: bash
        run: |
          set +e
          if [ -f build.log ]; then
            {
              echo '## Errors'
              echo '```'
              grep -E "^e: |error:|What went wrong|Could not|FAILED|Exception" -A3 build.log | head -150
              echo '```'
              echo '## Last lines'
              echo '```'
              tail -n 80 build.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "build.log not found" >> "$GITHUB_STEP_SUMMARY"
          fi
          exit 0

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk EduTube.apk

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: EduTube-apk
          path: EduTube.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.0.${{ github.run_number }}
          name: دروسي 2.0.${{ github.run_number }}
          body: |
            نسخة جديدة من تطبيق «دروسي».
            حمّل الملف EduTube.apk وثبّته على الهاتف.
          files: EduTube.apk
          make_latest: true
